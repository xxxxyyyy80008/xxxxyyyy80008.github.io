title: "A W "
description: "Quantitative Finance, Machine Learning, Derivatives Pricing, Portfolio Optimization, Risk Analysis"
# remote_theme: just-the-docs/just-the-docs
remote_theme: just-the-docs/just-the-docs
# Just the Docs settings
color_scheme: light # or "light"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  
# Aux Links (top-right buttons)
aux_links:
  "GitHub":
    - "https://github.com/xxxxyyyy80008"
  # "Resume (PDF)":
  #   - "/assets/docs/resume.pdf"
  # "LinkedIn":
  #   - "https://linkedin.com/in/aw"

aux_links_new_tab: true

# Enable MathJax for LaTeX math rendering
mathjax: true
mathjax_autoNumber: true  

# Additional MathJax settings
mathjax_config:
  tex:
    inlineMath: [['$', '$'], ['\(', '\)']]
    displayMath: [['$$', '$$'], ['\[', '\]']]
    processEscapes: true
    processEnvironments: true
    packages:
      '[+]': ['ams', 'color', 'bbox']
  options:
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    ignoreHtmlClass: 'tex2jax_ignore'  # class to ignore math processing
    processHtmlClass: 'tex2jax_process' # class to process math
  loader:
    load: ['[tex]/ams', '[tex]/color', '[tex]/bbox']
  startup:
    ready: () => {
      MathJax.startup.defaultReady();
      console.log('MathJax is ready!');
    }

# Enable syntax highlighting
highlighter: rouge
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  math_engine: mathjax  


url: "https://xxxxyyyy80008.github.io"
baseurl: "" 


# Footer
footer_content: "© 2026 A W. Quantitative Research"

# Back to Top Button
back_to_top: true
back_to_top_text: "↑ Top"

# Heading anchor links
heading_anchors: true

# External navigation links
nav_external_links:
  - title: GitHub Repos
    url: https://github.com/xxxxyyyy80008
    hide_icon: false

# Callouts (for highlighting key info)
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Code copy button
enable_copy_code_button: true

# Mermaid diagrams
mermaid:
  version: "10.6.0"

